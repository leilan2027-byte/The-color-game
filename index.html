<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Mixing Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Start Screen -->
    <div id="startScreen">
        <h1>Color Mixing Game</h1>
        <p>Test your knowledge of color mixing!</p>
        <button id="startButton">Start Game</button>
    </div>

    <!-- Game Screen -->
    <div id="gameScreen" style="display: none;">
        <h2 id="roundTitle">Basic Round</h2>
        <p id="scoreText">Correct in a row: 0/4</p>
        
        <div id="colorDisplay">
            <div id="color1" class="color-box"></div>
            <span id="colorOperation">+</span>
            <div id="color2" class="color-box"></div>
            <span>=</span>
            <span id="questionMark">?</span>
        </div>

        <div id="answerSection">
            <input type="text" id="userAnswer" placeholder="Enter your guess">
            <button id="submitButton">Submit</button>
        </div>

        <p id="feedback"></p>
    </div>

    <!-- Win Screen -->
    <div id="winScreen" style="display: none;">
        <h1>Congratulations!</h1>
        <p>Now you know your colors!</p>
        <button id="playAgainButton">Play Again</button>
    </div>

    <script src="script.js"></script>

</body>
</html>
